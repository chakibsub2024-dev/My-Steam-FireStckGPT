name: Build MyStream Fire TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'mystream-final/apps/android/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          for dir in apps/android mystream-final/apps/android android; do
            if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
              echo "project=$dir" >> "$GITHUB_OUTPUT"
              echo "Android project at: $dir"
              exit 0
            fi
          done
          echo 'Android project not found; settings files:'
          find . -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -print
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu-hosted runners ship with an Android SDK, so no setup-android action.
      - name: Verify SDK and accept Android licences
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory is missing: $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo 'sdkmanager not found on GitHub runner'
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          # Feed 'y' via process substitution so a closed pipe cannot trip pipefail.
          "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            < <(printf 'y\n%.0s' {1..100}) > /tmp/sdk-licenses.log 2>&1 || {
            cat /tmp/sdk-licenses.log
            exit 1
          }
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only used when the project has no wrapper (see Build step).
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE=./gradlew
          else
            GRADLE=gradle
          fi
          echo "Building with: $GRADLE"
          "$GRADLE" --no-daemon --stacktrace assembleDebug

      - name: Copy APK
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK missing at $APK"
            find "$ANDROID_DIR" -name '*.apk'
            exit 1
          fi
          cp "$APK" dist/MyStream-FireStick-debug.apk
          (cd dist && sha256sum MyStream-FireStick-debug.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStream-FireStick-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            ${{ steps.locate.outputs.project }}/**/build/reports/**
            /tmp/sdk-licenses.log
          if-no-files-found: ignore
          retention-days: 7
