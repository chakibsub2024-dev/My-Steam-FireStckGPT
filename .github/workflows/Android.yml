name: Android APK (phone + Android TV + Fire TV)

on:
  workflow_dispatch:
  push:
    paths: ['apps/android/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check the Android project was uploaded
        run: |
          ls -la apps/android apps/android/app/src/main || true
          for f in apps/android/settings.gradle apps/android/build.gradle apps/android/app/build.gradle apps/android/app/src/main/AndroidManifest.xml apps/android/app/src/main/java/com/mystream/app/MainActivity.java; do
            [ -f "$f" ] || { echo "::error::Missing $f - upload the apps/android folder from MyStream-source-v5.zip"; exit 1; }
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (pre-installed on GitHub's runner; accept licences, add Android 15)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK: $ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APKs
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease
      - name: Rename
        working-directory: apps/android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MyStream-12.1.0-android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/MyStream-12.1.0-android.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MyStream-android
          path: apps/android/out/*
