plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mystream.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mystream.app'
        minSdk 23
        targetSdk 35
        versionCode 1201
        versionName '12.1.0'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            // For a private family app this is fine; use your own keystore to publish.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
