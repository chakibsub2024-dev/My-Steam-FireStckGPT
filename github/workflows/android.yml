name: Build MyStream Fire TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'mystream-final/apps/android/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          for dir in apps/android mystream-final/apps/android android; do
            if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
              echo "project=$dir" >> "$GITHUB_OUTPUT"
              echo "Found Android project: $dir"
              exit 0
            fi
          done
          echo 'No Android Gradle project found. Repo root listing:'
          ls -la
          echo 'Gradle settings found:'
          find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print
          exit 1

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "Expected APK missing: $apk"
            find "$ANDROID_DIR" -type f -name '*.apk' -print
            exit 1
          fi
          cp "$apk" dist/MyStream-FireStick-debug.apk
          sha256sum dist/MyStream-FireStick-debug.apk > dist/SHA256SUMS.txt

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStream-FireStick-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 14
